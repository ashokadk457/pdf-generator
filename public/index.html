<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WannaTalk LAOS Report</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><div class="mark">WT</div><div><h1>WannaTalk</h1><p>LAOS intake report generator</p></div></header><section class="notice">Upload only information you are authorized to process. Review every generated report against the original transcript.</section><form action="/api/reports" method="post" enctype="multipart/form-data"><label>Patient name<input name="patientName" required></label><label>Reference number<input name="referenceNumber" required></label><div class="grid"><label>Email<input name="email" type="email"></label><label>Phone<input name="phone" type="tel"></label></div><div class="grid"><label>Age (optional)<input name="age"></label><label>Gender (optional)<input name="gender"></label></div><div class="grid"><label>Language (optional)<input name="language"></label><label>Session date<input name="sessionDate" type="date"></label></div><label>Intake type<select name="intakeType" required><option value="text">Text</option><option value="voice">Transcribed voice</option><option value="mixed">Mixed</option></select></label><label>Transcript (.txt)<input name="transcript" type="file" accept=".txt,text/plain" required></label><button>Create LAOS PDF</button></form></main></body></html>
