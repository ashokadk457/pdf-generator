<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WannaTalk Intake Report</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header><div class="mark">WT</div><div><h1>WannaTalk</h1><p>LAOS intake report generator</p></div></header>
    <section class="notice">Upload only information you are authorized to process. The generated report is a clinical-review aid and must be checked against the original transcript.</section>
    <form action="/api/reports" method="post" enctype="multipart/form-data">
      <label>Patient name<input name="patientName" required autocomplete="name"></label>
      <label>Reference number<input name="referenceNumber" required></label>
      <div class="grid">
        <label>Email<input name="email" type="email" autocomplete="email"></label>
        <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
      </div>
      <label>Intake type<select name="intakeType" required><option value="text">Text</option><option value="voice">Transcribed voice</option><option value="mixed">Mixed</option></select></label>
      <label>Transcript (.txt)<input name="transcript" type="file" accept=".txt,text/plain" required></label>
      <button type="submit">Extract information and create PDF</button>
    </form>
  </main>
</body>
</html>
